<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akamai STG 검증</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Malgun Gothic", sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
    -webkit-font-smoothing: antialiased;
  }
  header { padding: 48px 40px 8px; }
  h1 { margin: 0; font-size: 40px; font-weight: 600; letter-spacing: -0.02em; }
  header p { margin: 8px 0 0; color: #6e6e73; font-size: 17px; }
  main { display: grid; grid-template-columns: 320px 1fr; gap: 20px; padding: 28px 40px 48px; align-items: start; }
  section { background: #fff; border-radius: 20px; padding: 22px; }
  h2 { margin: 0 0 14px; font-size: 21px; font-weight: 600; letter-spacing: -0.015em; }
  input[type=search], #ip {
    width: 100%;
    height: 40px;
    padding: 0 14px;
    border: 0;
    border-radius: 12px;
    background: #f5f5f7;
    color: #1d1d1f;
    font: inherit;
    font-size: 15px;
  }
  input:focus { outline: 2px solid #0071e3; outline-offset: 1px; }
  button {
    height: 36px;
    padding: 0 16px;
    border: 0;
    border-radius: 980px;
    background: #f5f5f7;
    color: #1d1d1f;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
  }
  button.primary { background: #1d1d1f; color: #fff; }
  button:disabled { opacity: .35; cursor: default; }
  .rowbtns { display: flex; gap: 8px; margin: 12px 0; }
  #picked { color: #6e6e73; font-size: 13px; margin-bottom: 8px; }
  #sites { max-height: 62vh; overflow: auto; margin: 0 -8px; }
  #sites label, .pages label {
    display: flex;
    gap: 10px;
    align-items: center;
    min-height: 36px;
    padding: 0 8px;
    border-radius: 10px;
    font-size: 15px;
  }
  .pages { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .pages label {
    width: auto;
    min-height: 32px;
    padding: 0 12px;
    background: #f5f5f7;
  }
  .pages label, #sites label code, .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
  .toolbar { display: flex; align-items: flex-end; gap: 8px; flex-wrap: wrap; }
  .field.ip { width: 180px; margin: 0 8px 0 0; }
  .field.extra { width: 100%; margin: 0 0 16px; }
  .field.extra input { width: 100%; }
  #sites label:hover, .pages label:hover { background: #e8e8ed; }
  .field { display: block; margin: 8px 0 16px; }
  .field span { display: block; margin-bottom: 6px; color: #6e6e73; font-size: 13px; }
  #status { margin: 0 0 14px; color: #6e6e73; font-size: 15px; }
  #tablewrap { max-height: 62vh; overflow: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 12px 8px; text-align: left; font-size: 14px; border-bottom: 1px solid #f0f0f2; }
  th { position: sticky; top: 0; background: #fff; color: #6e6e73; font-size: 12px; font-weight: 600; }
  td { word-break: break-all; }
  td.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
  tr.OK td:first-child { color: #248a3d; font-weight: 600; }
  tr.FAIL td:first-child { color: #d70015; font-weight: 600; }
  @media (max-width: 800px) {
    header, main { padding-left: 20px; padding-right: 20px; }
    header { padding-top: 32px; }
    h1 { font-size: 32px; }
    main { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>Akamai STG 검증</h1>
  <p>www.samsung.com 을 스테이징 IP로 붙여 리다이렉트를 확인합니다.</p>
</header>
<main>
  <section>
    <h2>국가</h2>
    <input id="q" type="search" placeholder="코드 검색. 예: ae, sec">
    <div class="rowbtns">
      <button type="button" id="all">보이는 것 선택</button>
      <button type="button" id="none">선택 해제</button>
    </div>
    <div id="picked">선택 0</div>
    <div id="sites"></div>
  </section>
  <section>
    <h2>페이지</h2>
    <div class="pages" id="pages">
      <label><input type="checkbox" value="mypage"> /mypage/</label>
      <label><input type="checkbox" value="myproducts"> /mypage/myproducts/</label>
      <label><input type="checkbox" value="myrepair"> /mypage/myrepair/</label>
      <label><input type="checkbox" value="track-repair"> /mypage/myrepair/track-repair/</label>
      <label><input type="checkbox" value="getsupport"> /mypage/getsupport/</label>
      <label><input type="checkbox" value="mysmartthings"> /mypage/mysmartthings/</label>
      <label><input type="checkbox" value="rewards"> /mypage/rewards/</label>
    </div>
    <label class="field extra"><span>직접 입력</span><input id="extra" placeholder="/mypage/example/   여러 개는 쉼표로"></label>
    <div class="toolbar">
      <label class="field ip"><span>스테이징 IP</span><input id="ip" placeholder="직접 입력" autocomplete="off"></label>
      <button type="button" class="primary" id="run">검사</button>
      <button type="button" id="stop" disabled>중지</button>
      <button type="button" id="download" disabled>엑셀로 저장</button>
    </div>
    <div id="status">국가 목록을 불러오는 중...</div>
    <div id="tablewrap">
      <table>
        <thead><tr><th>결과</th><th>국가</th><th>경로</th><th>상태</th><th>Location</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</main>
<script>
var PAGE_PATHS = {
  mypage: "/mypage/",
  myproducts: "/mypage/myproducts/",
  myrepair: "/mypage/myrepair/",
  "track-repair": "/mypage/myrepair/track-repair/",
  getsupport: "/mypage/getsupport/",
  mysmartthings: "/mypage/mysmartthings/",
  rewards: "/mypage/rewards/"
};

function normalizePath(value) {
  var path = value.trim();
  if (!path) return "";
  if (path.charAt(0) !== "/") path = "/" + path;
  if (path === "/" || path.indexOf("..") !== -1 || !/^\/[A-Za-z0-9._~/-]*$/.test(path)) return "";
  return path;
}

function extraPaths() {
  var raw = document.getElementById("extra").value.split(/[,\n]/);
  var paths = [];
  var bad = [];
  raw.forEach(function (item) {
    var text = item.trim();
    if (!text) return;
    var path = normalizePath(text);
    if (!path) bad.push(text);
    else if (paths.indexOf(path) === -1) paths.push(path);
  });
  return { paths: paths, bad: bad };
}
var results = [];

function selected(root) {
  return Array.prototype.map.call(document.querySelectorAll("#" + root + " input:checked"), function (el) { return el.value; });
}
function esc(value) {
  return String(value == null ? "" : value).replace(/[&<>]/g, function (ch) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[ch];
  });
}
function updatePicked() {
  document.getElementById("picked").textContent = "선택 " + selected("sites").length;
}
function csvCell(value) {
  var text = String(value == null ? "" : value);
  if (/[",\r\n]/.test(text)) return '"' + text.replace(/"/g, '""') + '"';
  return text;
}
function addRow(row) {
  results.push(row);
  document.getElementById("download").disabled = false;
  var body = document.getElementById("rows");
  var tr = document.createElement("tr");
  tr.className = row.result;
  [row.result, row.sitecode, row.path, row.status, row.location].forEach(function (value, index) {
    var td = document.createElement("td");
    if (index === 2 || index === 4) td.className = "mono";
    td.textContent = value;
    tr.appendChild(td);
  });
  body.appendChild(tr);
  var box = document.getElementById("tablewrap");
  box.scrollTop = box.scrollHeight;
}

fetch("/api/sites").then(function (r) { return r.json(); }).then(function (data) {
  var html = "";
  (data.sites || []).forEach(function (code) {
    html += "<label data-code='" + esc(code) + "'><input type='checkbox' value='" + esc(code) + "'> " + esc(code) + "</label>";
  });
  document.getElementById("sites").innerHTML = html;
  document.getElementById("status").textContent = "국가와 페이지를 고른 다음 검사를 누르세요.";
});

document.getElementById("sites").addEventListener("change", updatePicked);
document.getElementById("q").oninput = function () {
  var q = this.value.trim().toLowerCase();
  document.querySelectorAll("#sites label").forEach(function (label) {
    label.style.display = label.getAttribute("data-code").toLowerCase().indexOf(q) === -1 ? "none" : "";
  });
};
document.getElementById("all").onclick = function () {
  document.querySelectorAll("#sites label").forEach(function (label) {
    if (label.style.display === "none") return;
    label.querySelector("input").checked = true;
  });
  updatePicked();
};
document.getElementById("none").onclick = function () {
  document.querySelectorAll("#sites input").forEach(function (input) { input.checked = false; });
  updatePicked();
};
document.getElementById("stop").onclick = function () { stopRequested = true; };
document.getElementById("download").onclick = function () {
  if (!results.length) return;
  var lines = [["결과", "국가", "경로", "상태", "Location", "이유"].join(",")];
  results.forEach(function (row) {
    lines.push([row.result, row.sitecode, row.path, row.status, row.location, row.reason].map(csvCell).join(","));
  });
  var blob = new Blob(["\uFEFF" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  var link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "akamai-stg.csv";
  link.click();
  URL.revokeObjectURL(link.href);
};

document.getElementById("run").onclick = async function () {
  var sites = selected("sites");
  var ip = document.getElementById("ip").value.trim();
  var extra = extraPaths();
  var paths = selected("pages").map(function (page) { return PAGE_PATHS[page]; });
  extra.paths.forEach(function (path) {
    if (paths.indexOf(path) === -1) paths.push(path);
  });
  if (!sites.length || !paths.length) {
    document.getElementById("status").textContent = "국가와 페이지를 하나 이상 고르세요.";
    return;
  }
  if (extra.bad.length) {
    document.getElementById("status").textContent = "경로 형식을 확인하세요. " + extra.bad.join(", ");
    return;
  }
  if (!ip) {
    document.getElementById("status").textContent = "스테이징 IP를 입력하세요.";
    return;
  }
  if (!/^(?:\d{1,3}\.){3}\d{1,3}$/.test(ip)) {
    document.getElementById("status").textContent = "스테이징 IP 형식을 확인하세요.";
    return;
  }
  stopRequested = false;
  results = [];
  document.getElementById("rows").innerHTML = "";
  document.getElementById("download").disabled = true;
  document.getElementById("run").disabled = true;
  document.getElementById("stop").disabled = false;
  var jobs = [];
  sites.forEach(function (site) {
    paths.forEach(function (path) { jobs.push({ site: site, path: path }); });
  });
  var pass = 0;
  var fail = 0;
  for (var i = 0; i < jobs.length; i++) {
    if (stopRequested) break;
    document.getElementById("status").textContent = (i + 1) + "/" + jobs.length + " 요청 중";
    var job = jobs[i];
    var response = await fetch("/api/check?site=" + encodeURIComponent(job.site) + "&path=" + encodeURIComponent(job.path) + "&ip=" + encodeURIComponent(ip));
    var row = await response.json();
    if (row.error) row = { result: "FAIL", sitecode: job.site, path: job.path, status: "ERR", location: row.error };
    if (row.result === "OK") pass++; else fail++;
    addRow(row);
    document.getElementById("status").textContent = (i + 1) + "/" + jobs.length + "  성공 " + pass + "  실패 " + fail;
  }
  document.getElementById("run").disabled = false;
  document.getElementById("stop").disabled = true;
  document.getElementById("status").textContent = (stopRequested ? "중지. " : "끝. ") + "성공 " + pass + " / 실패 " + fail;
};
</script>
</body>
</html>
